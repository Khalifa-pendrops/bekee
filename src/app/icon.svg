<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1724" />
      <stop offset="100%" stop-color="#3B0810" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997316" />
    </linearGradient>
  </defs>

  <!-- Luxury Circular Disc with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.75" />

  <!-- Shopping Bag Silhouette Inside -->
  <!-- Handle -->
  <path d="M 25 24 C 25 17, 39 17, 39 24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bag Body -->
  <path d="M 17 24 L 47 24 L 45 49 C 44.8 51, 43.5 52, 41 52 L 23 52 C 20.5 52, 19.2 51, 19 49 Z" 
        fill="#2A050B" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        stroke-linejoin="round" />

  <!-- Gold Serif 'A' Monogram -->
  <text x="32" y="44" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="18" 
        font-weight="700" 
        fill="url(#goldGrad)" 
        text-anchor="middle">A</text>

  <!-- Top-right Sparkle Star -->
  <polygon points="46,14 47.5,18 51.5,19.5 47.5,21 46,25 44.5,21 40.5,19.5 44.5,18" fill="#FFF2B2" />
</svg>